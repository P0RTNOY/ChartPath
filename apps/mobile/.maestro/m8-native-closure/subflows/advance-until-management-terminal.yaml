appId: ${CHARTPATH_NATIVE_APP_ID}
---
- scrollUntilVisible:
    element:
      id: paper-advance-one
    direction: DOWN
    timeout: 30000
    speed: 40
- repeat:
    while:
      visible:
        id: paper-advance-one
    commands:
      - runFlow:
          file: advance-paper-once.yaml
- scrollUntilVisible:
    element:
      id: paper-management-journal
    direction: DOWN
    timeout: 30000
    speed: 40
- scrollUntilVisible:
    element:
      id: paper-management-timeline
    direction: DOWN
    timeout: 30000
    speed: 40
- scrollUntilVisible:
    element:
      id: paper-management-debrief-marker
    direction: DOWN
    timeout: 30000
    speed: 40
- assertNotVisible:
    id: paper-management-submit
