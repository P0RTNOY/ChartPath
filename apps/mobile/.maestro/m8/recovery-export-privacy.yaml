appId: ${CHARTPATH_NATIVE_APP_ID}
name: M8 encrypted recovery reaches manual password entry without recording secrets
tags:
  - m8
  - recovery
  - privacy
---
- launchApp:
    appId: ${CHARTPATH_NATIVE_APP_ID}
- openLink: ${CHARTPATH_NATIVE_RECOVERY_ROUTE_URL}
- extendedWaitUntil:
    visible:
      id: recovery-center
    timeout: 90000
- assertVisible:
    id: recovery-privacy
- assertVisible:
    id: recovery-export
- tapOn:
    id: recovery-export-category-position-management-sessions
- assertVisible:
    id: recovery-export-consent-position-management-sessions
- tapOn:
    id: recovery-export-consent-position-management-sessions
- tapOn:
    id: recovery-export-password
- assertVisible:
    id: recovery-export-password-keyboard-done
- tapOn:
    id: recovery-export-password-keyboard-done
- assertVisible:
    id: recovery-export-create
    enabled: false
